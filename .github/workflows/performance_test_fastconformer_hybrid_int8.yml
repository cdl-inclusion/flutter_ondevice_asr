name: "Performance test - FastConformer hybrid int8 inference"

on:
  workflow_dispatch:
    inputs:
      environment:
        type: environment
        description: Select the environment

jobs:
  build:
    name: Performance test - FastConformer hybrid int8 inference
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}

    steps:
      #1 Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      #2 Setup Java
      - name: Set Up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      #3.a Setup Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
      - run: |
          flutter --version
          flutter doctor --verbose

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      #4 Install Dependencies & set android and iOS app bundle-ids
      - name: Install Dependencies
        run: |
          flutter pub get

      - name: Install Firebase CLI
        run: |
          sudo npm i -g firebase-tools

      - name : Authenticate google github actions
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: ${{ secrets.GOOGLE_SA_KEY }}

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v3'

      - name: 'Set Google Project underlying Firebase Project'
        run: gcloud config set project ${{ secrets.PROJECT_ID }}

      - name: 'Download and setup fast conformer int8 model in project asset'
        run: |
          mkdir -p assets/transcribers/fastconformer/int8
          gcloud storage cp ${{ secrets.FASTCONFORMER_HYBRID_INT8_ZIP_BUCKET_PATH }} .
          unzip fastconformer_int8.zip -d assets/transcribers/fastconformer/int8

      #6 Building APK
      - name: Build APK and trigger test on Pixel 8a, 6a, 10a and Galaxy Tab A36, A9+
        timeout-minutes: 20
        env:
          CI: true
        run: |
          cd example/android
          gradle wrapper
          ./gradlew app:assembleProfile -Ptarget="integration_test/fastconformer_firebase_performance_test.dart"
          ./gradlew app:assembleAndroidTest
          gcloud firebase test android run --type instrumentation \
            --app ../build/app/outputs/apk/profile/app-profile.apk \
            --test ../build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --device model=gta9pwifi,version=34,locale=en,orientation=portrait \
            --device model=akita,version=34,locale=en,orientation=portrait \
            --device model=bluejay,version=32,locale=en,orientation=portrait \
            --device model=a36xq,version=35,locale=en,orientation=portrait \
            --device model=stallion,version=36,locale=en,orientation=portrait \
            --timeout 15m \
            --directories-to-pull /sdcard/Documents

      - name: Pull performance traces
        run: |
          result=`gcloud storage ls ${{ secrets.TEST_LAB_OUTPUT_BUCKET }} | sort -k2r | tail -n 1`
          result_pixel8a_ctc="${result}akita-34-en-portrait/artifacts/sdcard/Documents/performance_trace_ctc.json"
          result_pixel6a_ctc="${result}bluejay-32-en-portrait/artifacts/sdcard/Documents/performance_trace_ctc.json"
          result_tab9p_ctc="${result}gta9pwifi-34-en-portrait/artifacts/sdcard/Documents/performance_trace_ctc.json"
          result_galaxy_a36_ctc="${result}a36xq-35-en-portrait/artifacts/sdcard/Documents/performance_trace_ctc.json"
          result_pixel_10a_ctc="${result}stallion-36-en-portrait/artifacts/sdcard/Documents/performance_trace_ctc.json"
          result_pixel8a_rnnt="${result}akita-34-en-portrait/artifacts/sdcard/Documents/performance_trace_rnnt.json"
          result_pixel6a_rnnt="${result}bluejay-32-en-portrait/artifacts/sdcard/Documents/performance_trace_rnnt.json"
          result_tab9p_rnnt="${result}gta9pwifi-34-en-portrait/artifacts/sdcard/Documents/performance_trace_rnnt.json"
          result_galaxy_a36_rnnt="${result}a36xq-35-en-portrait/artifacts/sdcard/Documents/performance_trace_rnnt.json"
          result_pixel_10a_rnnt="${result}stallion-36-en-portrait/artifacts/sdcard/Documents/performance_trace_rnnt.json"
          gcloud storage cp $result_pixel8a_ctc performance_trace_pixel_8a_ctc.json
          gcloud storage cp $result_pixel8a_rnnt performance_trace_pixel_8a_rnnt.json
          gcloud storage cp $result_pixel6a_ctc performance_trace_pixel_6a_ctc.json
          gcloud storage cp $result_galaxy_a36_ctc performance_trace_galaxy_a36_ctc.json
          gcloud storage cp $result_pixel_10a_ctc performance_trace_pixel_10a_ctc.json
          gcloud storage cp $result_pixel6a_rnnt performance_trace_pixel_6a_rnnt.json
          gcloud storage cp $result_tab9p_ctc performance_trace_galaxy_tab_9p_ctc.json
          gcloud storage cp $result_tab9p_rnnt performance_trace_galaxy_tab_9p_rnnt.json
          gcloud storage cp $result_galaxy_a36_rnnt performance_trace_galaxy_a36_rnnt.json
          gcloud storage cp $result_pixel_10a_rnnt performance_trace_pixel_10a_rnnt.json

      - name : Upload performance traces to workflow artifacts
        uses: 'actions/upload-artifact@v7'
        with:
          name: performance-traces
          path: |
            performance_trace_pixel_8a_ctc.json
            performance_trace_pixel_8a_rnnt.json
            performance_trace_pixel_6a_ctc.json
            performance_trace_pixel_6a_rnnt.json
            performance_trace_galaxy_tab_9p_ctc.json
            performance_trace_galaxy_tab_9p_rnnt.json
            performance_trace_pixel_10a_ctc.json
            performance_trace_pixel_10a_rnnt.json
            performance_trace_galaxy_a36_ctc.json
            performance_trace_galaxy_a36_rnnt.json
